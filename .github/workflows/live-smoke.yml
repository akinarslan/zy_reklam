name: Live Worker Smoke

on:
  push:
    branches: [main]

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Worker serves Projects mega menu
        shell: bash
        run: |
          set -euo pipefail
          URL="https://zy-reklam.akinarslanceng.workers.dev/"
          for attempt in $(seq 1 24); do
            echo "Attempt $attempt/24"
            if curl -fsSL --max-time 20 "$URL" -o live.html; then
              echo "Fetched $(wc -c < live.html) bytes"
              if grep -q 'data-project-menu' live.html && grep -q 'project-mega' live.html && grep -q 'data-brand-showcase' live.html; then
                echo "PASS: Projects mega menu and 3D brand showcase HTML are live."

                CSS_PATH=$(grep -oE 'href="[^"]+\.css"' live.html | head -1 | cut -d'"' -f2 || true)
                JS_PATH=$(grep -oE 'src="[^"]+\.js"' live.html | head -1 | cut -d'"' -f2 || true)

                if [ -n "$CSS_PATH" ]; then
                  curl -fsSL --max-time 20 "${URL%/}$CSS_PATH" -o live.css
                  grep -q 'promo-mega' live.css
                  grep -q 'project-menu-grid' live.css
                  grep -q 'brand-showcase-stage' live.css
                  echo "PASS: mega-menu and brand-showcase CSS are live."
                else
                  echo "FAIL: no built CSS asset found."
                  exit 1
                fi

                if [ -n "$JS_PATH" ]; then
                  curl -fsSL --max-time 20 "${URL%/}$JS_PATH" -o live.js
                  grep -q 'data-project-menu' live.js
                  echo "PASS: project-menu JS is live."
                else
                  echo "FAIL: no built JS asset found."
                  exit 1
                fi

                exit 0
              fi
              echo "Mega menu markers not present yet."
              grep -o '<title>[^<]*</title>' live.html | head -1 || true
            fi
            sleep 10
          done
          echo "FAIL: Projects mega menu not found on live Worker."
          exit 1
