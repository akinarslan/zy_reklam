name: Verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: docs/evidence/

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare and verify Projects mega menu
        shell: bash
        run: |
          set -euo pipefail
          URL="https://zy-reklam.akinarslanceng.workers.dev/"
          for attempt in $(seq 1 18); do
            echo "Attempt $attempt/18: $URL"
            if curl -fsSL --max-time 20 "$URL" -o live.html; then
              if grep -q 'data-project-menu' live.html && grep -q 'project-mega' live.html; then
                echo "PASS: live Worker contains the Projects mega menu."
                grep -o 'data-project-menu' live.html | head -1
                exit 0
              fi
              echo "Live HTML fetched, but Projects mega menu markers are missing."
              grep -o '<nav id="main-nav"[^>]*>.*</nav>' live.html | head -c 2000 || true
              echo
            else
              echo "Worker fetch failed."
            fi
            sleep 10
          done
          echo "FAIL: Cloudflare Worker did not serve the Projects mega menu within the retry window."
          exit 1
